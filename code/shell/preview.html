<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>设备记录</title>

    <style>
      body {
        margin: 0;
        font-family: Arial;
        background: #f5f6fa;
      }

      .container {
        padding: 15px;
      }

      .title {
        font-size: 20px;
        font-weight: bold;
        margin-bottom: 10px;
      }

      select {
        width: 100%;
        padding: 10px;
        border-radius: 6px;
        border: 1px solid #ddd;
        margin-bottom: 15px;
        font-size: 16px;
      }

      .card {
        background: white;
        border-radius: 10px;
        padding: 12px;
        margin-bottom: 10px;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
      }

      .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 6px;
        font-size: 14px;
      }

      .label {
        color: #666;
      }

      .value {
        font-weight: 500;
      }

      .success {
        color: #2ecc71;
        font-weight: bold;
      }

      .test {
        color: #f39c12;
        font-weight: bold;
      }

      .time {
        font-size: 12px;
        color: #999;
      }

      .empty {
        text-align: center;
        padding: 30px;
        color: #999;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <div class="title">设备打卡记录</div>

      <select id="typeSelect">
        <option value="">全部</option>
        <option value="test">测试</option>
        <option value="checkinSuccess">打卡成功</option>
      </select>

      <div id="list"></div>
    </div>

    <script>
      const data = []

      function render(type) {
        let list = data

        if (type) {
          list = data.filter((i) => i.checkType === type)
        }

        const container = document.getElementById('list')

        container.innerHTML = ''

        if (list.length === 0) {
          container.innerHTML = `<div class="empty">暂无数据</div>`
          return
        }

        list.forEach((item) => {
          const typeText = item.checkType === 'test' ? '测试' : '打卡成功'
          const typeClass = item.checkType === 'test' ? 'test' : 'success'

          const card = document.createElement('div')
          card.className = 'card'

          card.innerHTML = `
                <div class="row">
                <span class="label">设备</span>
                <span class="value">${item.deviceName}</span>
                </div>

                <div class="row">
                <span class="label">类型</span>
                <span class="${typeClass}">${typeText}</span>
                </div>

                <div class="row">
                <span class="label">消息</span>
                <span>${item.rawMessage}</span>
                </div>

                <div class="time">${formatTime(item.checkTime)}</div>
              `

          container.appendChild(card)
        })
      }

      function formatTime(time) {
        const d = new Date(time)

        return d.toLocaleString()
      }

      document.getElementById('typeSelect').addEventListener('change', function () {
        console.log(`output->document.getElementById('typeSelect')`, document.getElementById('typeSelect').value)
        render(this.value)
      })

      render()

      function getDataList() {
        const type = document.getElementById('typeSelect').value
        fetch('http://117.72.47.76/api/iot/list?type=' + type)
          .then((res) => res.json())
          .then((data) => {
            renderTable(data)
          })
      }

      getDataList()
    </script>
  </body>
</html>
